[book]
authors = ["Omar Shehata"]
language = "en"
src = "src"
title = "Anatomy of an Internet Argument"

[output.html]
site-url = "/internet-court/"
edit-url-template = "https://github.com/Prosocial-Engineering/internet-court/edit/main/{path}"
git-repository-url = "https://github.com/Prosocial-Engineering/internet-court"
default-theme = "ayu"

[output.html.print]
enable = false

[output.html.fold]
enable = true
level = 0

# PDF output via mdbook-pandoc (local only). Skipped when mdbook-pandoc isn't installed.
[output.pandoc]
optional = true

[output.pandoc.profile.pdf]
output-file = "anatomy-of-an-internet-argument.pdf"
to = "latex"
pdf-engine = "tectonic"
